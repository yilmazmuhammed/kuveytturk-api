name: Publish

# GitHub'da bir Release yayınlandığında paketi PyPI'a yükler.
# PyPI tarafında "Trusted Publisher" tanımlanmış olmalı (token gerekmez):
#   https://pypi.org/manage/account/publishing/  ->  workflow: publish.yml, environment: pypi
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
