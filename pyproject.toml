[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kuveytturk-api"
dynamic = ["version"]
description = "Kuveyt Türk API Market için gayriresmî Python istemcisi (OAuth2, RSA imza, senkron ve asenkron)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Muhammed Yılmaz" }]
keywords = ["kuveytturk", "kuveyt türk", "api market", "open banking", "açık bankacılık", "banking", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Turkish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24,<1",
    "cryptography>=41",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "flask>=3",          # yalnızca examples/web_app ve testi için
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/yilmazmuhammed/kuveytturk-api"
Repository = "https://github.com/yilmazmuhammed/kuveytturk-api"
Issues = "https://github.com/yilmazmuhammed/kuveytturk-api/issues"
Changelog = "https://github.com/yilmazmuhammed/kuveytturk-api/blob/main/CHANGELOG.md"
"API Market" = "https://developer.kuveytturk.com.tr"

[tool.hatch.version]
path = "src/kuveytturk_api/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kuveytturk_api"]

# sdist'e yalnızca açıkça listelenenler girer; .env, .secrets vb. asla paketlenmez.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "scripts",
    "spec",
    "examples",
    "README.md",
    "ENDPOINTS.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "live: Kuveyt Türk sandbox'ına gerçek istek atar (KUVEYTTURK_LIVE=1 ve .env gerekir)",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "scripts"]

[tool.ruff.format]
# Üretilen modüller scripts/generate.py çıktısıyla birebir aynı kalmalı.
exclude = ["src/kuveytturk_api/resources/[!_]*.py", "src/kuveytturk_api/resources/__init__.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # satır uzunluğunu biçimlendirici yönetir; Türkçe docstring'ler uzayabilir
    "RUF001", # Türkçe karakterler "ambiguous unicode" sayılmasın
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src/kuveytturk_api"]
