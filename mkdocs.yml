site_name: kuveytturk-api
site_description: Kuveyt Türk API Market için gayriresmî Python istemcisi
site_author: Muhammed Yılmaz
site_url: https://yilmazmuhammed.github.io/kuveytturk-api/
repo_url: https://github.com/yilmazmuhammed/kuveytturk-api
repo_name: yilmazmuhammed/kuveytturk-api
edit_uri: edit/main/docs/
copyright: Bu kütüphane gayriresmîdir; Kuveyt Türk tarafından geliştirilmemekte ve desteklenmemektedir.
docs_dir: docs
strict: true

theme:
  name: material
  language: tr
  font: false # sistem yazı tipleri; dış sunucudan yazı tipi indirilmez
  icon:
    logo: material/bank-outline
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Koyu temaya geç
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Açık temaya geç

plugins:
  - search:
      lang: [tr, en]
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            show_bases: false
            heading_level: 2
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/kuveytturk-api/
      name: PyPI

nav:
  - Başlangıç:
      - index.md
      - Kurulum ve ilk istek: baslangic.md
      - Yetkilendirme: yetkilendirme.md
      - Değişiklikler: degisiklikler.md
  - Kılavuzlar:
      - Hesaplar ve hareketler: kilavuzlar/hesaplar.md
      - IBAN'a para transferi: kilavuzlar/para-transferi.md
      - Web uygulamasında müşteri girişi: kilavuzlar/web-uygulamasi.md
      - Asenkron kullanım: kilavuzlar/asenkron.md
      - Hata yönetimi: kilavuzlar/hata-yonetimi.md
      - Loglama: kilavuzlar/loglama.md
      - Doğrudan istek ve kaçış yolları: kilavuzlar/dogrudan-istek.md
      - Sandbox notları: sandbox-notlari.md
  - Uç noktalar:
      - uc-noktalar/index.md
      # >>> uç nokta sayfaları: scripts/generate.py üretir, elle düzenlemeyin
      - kt.accounts: uc-noktalar/accounts.md
      - kt.architecht: uc-noktalar/architecht.md
      - kt.cards: uc-noktalar/cards.md
      - kt.cash_management: uc-noktalar/cash_management.md
      - kt.credibility: uc-noktalar/credibility.md
      - kt.donations: uc-noktalar/donations.md
      - kt.ecommerce: uc-noktalar/ecommerce.md
      - kt.financing: uc-noktalar/financing.md
      - kt.fx: uc-noktalar/fx.md
      - kt.hgs: uc-noktalar/hgs.md
      - kt.information: uc-noktalar/information.md
      - kt.moneygram: uc-noktalar/moneygram.md
      - kt.other: uc-noktalar/other.md
      - kt.payment_solutions: uc-noktalar/payment_solutions.md
      - kt.payments: uc-noktalar/payments.md
      - kt.sgk: uc-noktalar/sgk.md
      - kt.sms_otp: uc-noktalar/sms_otp.md
      - kt.support: uc-noktalar/support.md
      - kt.tpp_accounts: uc-noktalar/tpp_accounts.md
      - kt.transfers: uc-noktalar/transfers.md
      - kt.treasury: uc-noktalar/treasury.md
      - kt.vpos: uc-noktalar/vpos.md
      - kt.your_banking: uc-noktalar/your_banking.md
      # <<< uç nokta sayfaları
  - Kütüphane referansı:
      - İstemciler: referans/istemciler.md
      - Yetkilendirme: referans/yetkilendirme.md
      - Token'lar ve depolar: referans/tokenlar.md
      - Yanıtlar: referans/yanitlar.md
      - Hatalar: referans/hatalar.md
      - İmza ve ortamlar: referans/imza-ve-ortamlar.md
